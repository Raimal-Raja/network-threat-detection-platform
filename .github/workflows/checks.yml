name: Research platform checks
on:
  push:
    branches: [main, step-07-analyst]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned service dependencies
        run: python -m pip install -r requirements-service.txt
      - name: Run all unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        run: node --check threat_platform/static/analyst.js
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise analyst workflow in Chromium
        run: python tests/browser_smoke.py
      - name: Preserve browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analyst-browser-proof
          path: artifacts/verification/
          retention-days: 7
          if-no-files-found: warn
